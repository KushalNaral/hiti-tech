version: '3.8'

services:
  frontend:
    build:
      context: ./artifacts/hiti-tech
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - VITE_PORT=80
      - PORT=3000
      - BASE_PATH=/
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./artifacts/api-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Database configuration - adjust these for your setup
      - DATABASE_URL=postgresql://hiti_user:hiti_password@db:5432/hiti_db
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=hiti_db
      - DB_USER=hiti_user
      - DB_PASSWORD=hiti_password
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=hiti_db
      - POSTGRES_USER=hiti_user
      - POSTGRES_PASSWORD=hiti_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: