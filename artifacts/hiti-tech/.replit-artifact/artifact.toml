kind = "web"
previewPath = "/"
title = "HITI TECH"
version = "1.0.0"
id = "artifacts/hiti-tech"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25999

[services.development]
run = "pnpm --filter @workspace/hiti-tech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hiti-tech", "run", "build" ]
publicDir = "artifacts/hiti-tech/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25999"
BASE_PATH = "/"
